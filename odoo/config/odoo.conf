[options]
; Contrasena maestra para /web/database/manager (crear/borrar bases de datos).
; Cambiala antes de exponer este servidor mas alla de tu máquina local.
admin_passwd = cambia-esta-contrasena-maestra

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; En desarrollo local puedes dejar esto en True para ver el listado de bases
; de datos en /web/database/manager. Cambialo a False antes de exponer el
; servidor a una red compartida o a internet.
list_db = True
